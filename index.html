<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disease Diagnosis System</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <h1>Disease Diagnosis</h1>
    <p>Enter your symptoms (comma-separated):</p>
    <input type="text" id="symptomInput" placeholder="e.g. fever, cough">
    <span id="inputError" class="error"></span>
    <button id="diagnoseBtn">Diagnose</button>
    <div id="loading" class="hidden">Diagnosing...</div>
    <div id="result"></div>
    <button id="historyBtn">View Diagnosis History</button>
    <div id="history" class="modal hidden"></div>
  </div>
  <script type="module" src="script.js"></script>
</body>

</html>
